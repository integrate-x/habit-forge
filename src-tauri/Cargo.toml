[package]
name = "habit-forge"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
habit-forge-core = { path = "core" }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
